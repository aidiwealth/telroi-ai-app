; Voice OTP.
;
; One voice throughout — intro, each digit, the repeat line and the closing
; warning are all the same ElevenLabs voice, generated once and played from disk.
; Nothing is synthesised per call, so volume costs only carrier minutes and the
; code never leaves this machine.
;
; The second reading is signposted rather than just repeated: somebody writing a
; code down needs to know another go is coming, not wonder whether the recording
; has looped.
;
; OTP_DEST, OTP_TRUNK, OTP_CID, CODE and REPEATS arrive as channel variables.
; REPEATS is honoured for the count; anything past the second reading uses the
; repeat line again.

[otp-out]
exten => s,1,NoOp(OTP dialling ${OTP_DEST} via ${OTP_TRUNK})
 same => n,Set(CALLERID(num)=${OTP_CID})
 same => n,Set(CALLERID(name)=Telroi)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Set(r=0)

 same => n(loop),GotoIf($[${r} > 0]?again)
 same => n,Playback(telroi/intro,noanswer)
 same => n,Goto(digits)
 same => n(again),Playback(telroi/repeat,noanswer)

 same => n(digits),Set(i=0)
 same => n(digit),Set(d=${CODE:${i}:1})
 same => n,GotoIf($["${d}"=""]?spoken)
 same => n,Playback(telroi/${d},noanswer)
 same => n,Set(i=$[${i} + 1])
 same => n,Goto(digit)

 same => n(spoken),Wait(1)
 same => n,Set(r=$[${r} + 1])
 same => n,GotoIf($[${r} < ${REPEATS}]?loop)

 same => n,Playback(telroi/outro,noanswer)
 same => n,Hangup()
