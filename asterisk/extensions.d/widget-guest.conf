; Live Call widget guests.
;
; A visitor's browser registers here with leased credentials it can read — so
; assume those credentials will be captured. This context is the containment:
; there is exactly one extension, it goes straight into Stasis, and there is no
; pattern that could reach a trunk. Someone who steals a guest credential can
; ring a support agent and nothing else. No _X., no outbound, ever.
;
; The tenant is fixed on the endpoint at lease time and arrives as CHANNEL
; variable WIDGET_TENANT, so a guest cannot dial its way into another tenant.
[widget-guest]
exten => connect,1,NoOp(Widget guest ${CHANNEL(endpoint)} -> tenant ${WIDGET_TENANT})
 same => n,Stasis(telroi,widget:${WIDGET_TENANT})
 same => n,Hangup()
