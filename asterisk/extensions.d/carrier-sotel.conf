; Auto-generated by Telroi carrier provisioning — Sotel
; Outbound accepts 83+234XXXXXXXXXX (canonical) or 83+0XXXXXXXXXX (national);
; both normalize to DEST=234XXXXXXXXXX before dialing the trunk.
[carrier-sotel-out]
exten => _83234XXXXXXXXXX,1,Set(DEST=${EXTEN:2})
 same => n,Goto(soteldial,1)
exten => _830XXXXXXXXXX,1,Set(DEST=234${EXTEN:3})
 same => n,Goto(soteldial,1)
exten => soteldial,1,NoOp(Sotel out -> ${DEST})
 ; Log from a hangup handler rather than after Dial. Asterisk stops running the
 ; dialplan the moment the calling channel hangs up, so a CURL on the next
 ; priority only fires when Dial returns by itself — busy, no answer,
 ; congestion. An answered call where the caller hangs up first never reached
 ; it, so it was never logged and never charged: not one completed outbound
 ; call existed for any Nigerian carrier, only the failures.
 ;
 ; Pushed before Dial so it is registered whatever happens afterwards, and
 ; CDR(billsec) inside a handler reports the answered duration, which is what
 ; the charge is calculated from.
 same => n,Set(CHANNEL(hangup_handler_push)=telroi-log,s,1(sotel))
 same => n,Set(CID=${ODBC_CALLERID_FOR(${CHANNEL(endpoint)},sotel)})
 same => n,GotoIf($["${CID}"=""]?nodid)
 same => n,Set(CALLERID(num)=${CID})
 same => n,Set(CALLERID(name)=Telroi)
 same => n,Set(TELROI_START=${EPOCH})
 same => n,Dial(PJSIP/sotel-endpoint/sip:${DEST}@102.223.37.253:5060,60)
 ; The carrier's second SBC. Their maintenance windows move traffic to it, and
 ; a trunk that only knows the primary fails at exactly the moment failover was
 ; meant to help. Only retried when the first was unreachable — a busy or
 ; rejected call is an answer, and dialling again would double the attempt.
 same => n,GotoIf($["${DIALSTATUS}"="CHANUNAVAIL"]?second)
 same => n,GotoIf($["${DIALSTATUS}"="CONGESTION"]?second)
 same => n,Goto(logit)
 same => n(second),NoOp(Sotel primary unreachable — trying secondary)
 same => n,Dial(PJSIP/sotel-endpoint/sip:${DEST}@102.209.45.28:5060,60)
 same => n(logit),NoOp(dial finished: ${DIALSTATUS})
 same => n,Hangup()
 same => n(nodid),NoOp(Rejected: caller owns no DID on sotel — buy/select a DID or contact support)
 same => n,Hangup(21)

[from-sotel]
exten => _X.,1,NoOp(Inbound from Sotel -> DID ${EXTEN} from ${CALLERID(num)})
 ; Do we hold this number? A carrier that routes its whole block at us rather
 ; than the DIDs we bought sends calls for numbers we have never sold — each one
 ; entering Stasis, being looked up, refused, and filling the log. Dropped here
 ; instead, before the application sees it.
 ;
 ; Only a definite 0 rejects. An empty result is what an unreachable database
 ; gives, and refusing every inbound call because the database hiccupped would be
 ; a great deal worse than the problem this solves — so anything else falls
 ; through and lets Stasis decide, exactly as before.
 same => n,Set(HELD=${ODBC_DID_EXISTS(${EXTEN})})
 same => n,GotoIf($["${HELD}" = "0"]?notours)
 same => n,Stasis(telroi,${EXTEN})
 same => n,Hangup()
 same => n(notours),NoOp(DID ${EXTEN} is not one of ours - dropping)
 same => n,Hangup(1)
