; Telroi — inbound from Telnyx (AI escalation handoff).
; The AI media adapter transfers to sip:esc-<DID>@sip.telroi.ai when a caller
; needs a human. The esc- prefix marks it as an escalation so Stasis rings the
; tenant's agents instead of handing the caller back to the AI (which would loop).
[from-carrier]
; NOTE: the DID arrives E.164 (esc-+1405...), and Asterisk's X only matches a
; digit — so the pattern must allow the leading +. `.` matches one-or-more of
; anything, which is what we want after the esc- marker.
exten => _esc-.,1,NoOp(Carrier escalation -> DID ${EXTEN:4} from ${CALLERID(num)})
 ; The team the AI named, if it named one. Read off the INVITE and put on the
 ; channel, because Stasis sees channel variables and not headers — without this
 ; a caller who asked for billing reached whoever happened to be free.
 same => n,Set(TELROI_DEPT=${PJSIP_HEADER(read,X-Telroi-Department)})
 same => n,NoOp(department: ${TELROI_DEPT})
 same => n,Stasis(telroi,${EXTEN})
 same => n,Hangup()

; Live Call widget: a visitor's browser reaches us through the carrier and asks
; for this tenant's agents. The tenant id rides in the user part.
; Anything else arriving from Telnyx over SIP is unexpected — log and reject
; rather than silently bridging an unrouted call.
exten => _X.,1,NoOp(Unexpected carrier SIP inbound -> ${EXTEN} from ${CALLERID(num)})
 same => n,Hangup(1)
