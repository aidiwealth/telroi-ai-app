; Voice notification.
;
; One file, played once. Unlike OTP there are no digits to read and no repeat:
; a code is worth hearing twice because somebody is writing it down, and a
; message is not — a caller who missed it can be sent another, and repeating an
; unsolicited call's contents doubles a carrier minute we pay for.
;
; NOTIFY_MEDIA is a sound name relative to Asterisk's sounds directory, without
; the extension. The control app synthesises the audio and stages it there
; before originating, so the file exists by the time this runs.
;
; The hangup handler both reports the outcome and removes the audio. A
; directory of orphaned speech grows quietly until a disk fills, and nothing
; else would ever delete it.

[notify-out]
exten => s,1,NoOp(Notification to ${NOTIFY_DEST})
 ; The caller id has to belong to the carrier carrying the call: a Ruach number
 ; on a Kasooko trunk is refused as blacklisted, and Telnyx will not present a
 ; Nigerian one. So the tenant's own DID for this carrier is looked up here, the
 ; way every other outbound context does it, and the value passed by the control
 ; app is only a fallback for a tenant who holds none.
 same => n,Set(CID=${ODBC_CALLERID_FOR(${NOTIFY_ENDPOINT},${NOTIFY_CARRIER})})
 same => n,GotoIf($["${CID}"=""]?nolookup)
 same => n,Set(CALLERID(num)=${CID})
 same => n,Goto(named)
 same => n(nolookup),Set(CALLERID(num)=${NOTIFY_CID})
 same => n(named),Set(CALLERID(name)=Telroi)
 same => n,Set(CHANNEL(hangup_handler_push)=notify-log,s,1(${NOTIFY_ID}))
 same => n,Set(TELROI_START=${EPOCH})
 same => n,Answer()
 ; A moment before speaking: a phone answered mid-sentence loses the opening
 ; words, and the first thing said is usually who is calling.
 same => n,Wait(1)
 same => n,Playback(${NOTIFY_MEDIA},noanswer)
 same => n,Hangup()

[notify-log]
; Reports duration so the call can be billed, and clears the audio.
exten => s,1,NoOp(Notification ${ARG1} ended — ${CDR(billsec)}s, ${DIALSTATUS})
 same => n,Set(X=${CURL(http://127.0.0.1:8090/notify-done?id=${ARG1}&duration=${CDR(billsec)}&hangupcause=${HANGUPCAUSE}&start=${TELROI_START})})
 same => n,System(rm -f ${NOTIFY_MEDIA}.wav)
 same => n,Return()
