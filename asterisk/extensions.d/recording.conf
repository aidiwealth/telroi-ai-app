; Recording, entered from Stasis and returned from immediately.
;
; MixMonitor rather than ARI's own recording because ARI records one direction:
; channel.record() captures what the caller says and not what they hear, and the
; bridge feature only exists once somebody has answered — which would miss the
; notice and the entire AI conversation. A recording with the first half missing
; is worse than none: the dispute you most need it for is the one where
; something went wrong early.
;
; WAV because MixMonitor writes it without transcoding, on a box that is also
; carrying the call. The conversion to something smaller happens after hangup,
; off the critical path.
[telroi-record]
exten => start,1,NoOp(Recording ${CHANNEL} -> ${REC_FILE})
 same => n,MixMonitor(${REC_FILE}.wav)
 same => n,Return()
